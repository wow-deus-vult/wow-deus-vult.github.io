<!DOCTYPE html>
<html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deus Vult – Champion Cat</title>
<style>html,body{margin:0;padding:0;height:100%;overflow:hidden;background:radial-gradient(ellipse 70% 70% at 50% 35%, rgba(60,34,10,.55), rgba(13,18,27,.92));}#dv-cat-mount{position:absolute;inset:0;}</style>
</head><body>
<div style="position:absolute;inset:0;">
  <div id="dv-cat-mount"></div>
    <div style="position:absolute;top:7px;left:0;right:0;text-align:center;pointer-events:none;z-index:2;">
      <div style="font-family:Georgia,'Times New Roman',serif;font-size:15px;font-weight:700;color:#9db8e0;text-shadow:0 1px 4px rgba(0,0,0,.95);">Веселун Калабаня</div>
      <div style="font-family:Georgia,'Times New Roman',serif;font-size:13px;color:#a6b0bd;text-shadow:0 1px 4px rgba(0,0,0,.95);margin-top:1px;">&lt;Deus Vult&gt;</div>
    </div>
</div>
<script>

const base='https://unpkg.com/three@0.134.0/';
const urls=[base+'build/three.min.js',base+'examples/js/objects/Reflector.js',base+'examples/js/shaders/CopyShader.js',base+'examples/js/shaders/LuminosityHighPassShader.js',base+'examples/js/postprocessing/Pass.js',base+'examples/js/postprocessing/ShaderPass.js',base+'examples/js/postprocessing/MaskPass.js',base+'examples/js/postprocessing/EffectComposer.js',base+'examples/js/postprocessing/RenderPass.js',base+'examples/js/postprocessing/UnrealBloomPass.js'];
function loadOne(u){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=u;s.async=false;s.onload=()=>res();s.onerror=()=>rej(new Error('load '+u));document.head.appendChild(s);});}
urls.reduce((p,u)=>p.then(()=>loadOne(u)),Promise.resolve()).then(()=>{ try{ initCat(); }catch(e){ console.error(e); } });
function initCat(){ let _catRAF;

    const T = window.THREE;
    const mount = document.getElementById('dv-cat-mount');
    if (!T || !mount) return;
    let W = mount.clientWidth || 300, H = mount.clientHeight || 250;

    const scene = new T.Scene();
    const camera = new T.PerspectiveCamera(36, W / H, 0.1, 100);
    camera.position.set(0, 1.2, 6.8); camera.lookAt(0, 0.42, 0);
    const renderer = new T.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(W, H, false); renderer.setClearColor(0x000000, 0);
    renderer.domElement.style.width = '100%'; renderer.domElement.style.height = '100%'; renderer.domElement.style.display = 'block';
    mount.appendChild(renderer.domElement);

    const composer = new T.EffectComposer(renderer);
    composer.addPass(new T.RenderPass(scene, camera));
    const bloom = new T.UnrealBloomPass(new T.Vector2(W, H), 0.48, 0.5, 0.82);
    composer.addPass(bloom); composer.setSize(W, H);

    try { const pmrem = new T.PMREMGenerator(renderer); const eScene = new T.Scene(); eScene.background = new T.Color(0x120d07); const eLight = new T.Mesh(new T.SphereGeometry(12, 16, 16), new T.MeshBasicMaterial({ color: 0x2b2016, side: T.BackSide })); eScene.add(eLight); scene.environment = pmrem.fromScene(eScene, 0, 0.1, 30).texture; } catch (e) {}

    const fur = (c, r) => new T.MeshStandardMaterial({ color: c, roughness: r == null ? 0.62 : r, metalness: 0.05 });
    const glow = (c) => new T.MeshBasicMaterial({ color: c });
    const goldMat = new T.MeshStandardMaterial({ color: 0xffcf3a, roughness: 0.34, metalness: 0.5, emissive: 0x3a2600, emissiveIntensity: 0.45 });

    const cat = new T.Group(); scene.add(cat);
    const CBODY = 0x9c7044, CHEAD = 0xa87b4d, CCREAM = 0xd9b985, CDARK = 0x6d4a28;
    const body = new T.Mesh(new T.SphereGeometry(1, 40, 32), fur(CBODY)); body.scale.set(1.03, 0.95, 0.9); body.position.y = -0.12; cat.add(body);
    const belly = new T.Mesh(new T.SphereGeometry(0.6, 32, 26), fur(CCREAM, 0.7)); belly.scale.set(0.95, 1.05, 0.55); belly.position.set(0, -0.18, 0.62); cat.add(belly);
    [[-0.16, 0.32], [0.16, 0.30], [0, 0.52]].forEach((s) => { const st = new T.Mesh(new T.SphereGeometry(0.5, 16, 12), fur(CDARK, 0.72)); st.scale.set(0.15, 0.4, 0.72); st.position.set(s[0], s[1], -0.5); cat.add(st); });

    const head = new T.Group(); head.position.set(0, 0.86, 0.14); cat.add(head);
    head.add(new T.Mesh(new T.SphereGeometry(0.68, 40, 32), fur(CHEAD)));
    [-0.17, 0, 0.17].forEach((x) => { const st = new T.Mesh(new T.SphereGeometry(0.3, 14, 10), fur(CDARK, 0.72)); st.scale.set(0.11, 0.5, 0.5); st.position.set(x, 0.44, 0.4); head.add(st); });
    const cheekL = new T.Mesh(new T.SphereGeometry(0.28, 20, 18), fur(CHEAD)); cheekL.position.set(-0.42, -0.16, 0.34); head.add(cheekL);
    const cheekR = cheekL.clone(); cheekR.position.x = 0.42; head.add(cheekR);
    const muzzle = new T.Mesh(new T.SphereGeometry(0.24, 20, 18), fur(CCREAM, 0.72)); muzzle.scale.set(1.1, 0.7, 0.7); muzzle.position.set(0, -0.2, 0.56); head.add(muzzle);

    const ear = (s) => {
      const g = new T.Group(); g.position.set(s * 0.44, 0.48, 0.02); g.rotation.z = -s * 0.22;
      const outer = new T.Mesh(new T.ConeGeometry(0.26, 0.5, 18), fur(0x6d4a28)); outer.rotation.x = -0.12; g.add(outer);
      const inn = new T.Mesh(new T.ConeGeometry(0.15, 0.34, 16), fur(0xc79c78, 0.8)); inn.position.set(0, 0.0, 0.07); inn.rotation.x = -0.12; g.add(inn);
      head.add(g); return g;
    };
    const earL = ear(-1), earR = ear(1);

    const eyes = [];
    [-0.25, 0.25].forEach((x) => {
      const e = new T.Group(); e.position.set(x, 0.05, 0.6); head.add(e);
      const w = new T.Mesh(new T.SphereGeometry(0.15, 20, 18), glow(0xffc23a)); w.scale.set(0.9, 1.15, 0.55); e.add(w);
      const p = new T.Mesh(new T.SphereGeometry(0.075, 14, 14), new T.MeshBasicMaterial({ color: 0x140500 })); p.scale.set(1, 1.5, 0.6); p.position.z = 0.09; e.add(p);
      const gl = new T.Mesh(new T.SphereGeometry(0.03, 8, 8), glow(0xffffff)); gl.position.set(0.04, 0.05, 0.12); e.add(gl);
      eyes.push(e);
    });
    const nose = new T.Mesh(new T.SphereGeometry(0.08, 12, 10), fur(0xc07f76, 0.5)); nose.scale.set(1.3, 0.8, 0.8); nose.position.set(0, -0.16, 0.78); head.add(nose);

    // crown
    const crown = new T.Group(); crown.position.set(0, 0.64, 0.02); head.add(crown);
    const band = new T.Mesh(new T.CylinderGeometry(0.42, 0.46, 0.2, 28, 1, true), goldMat); crown.add(band);
    for (let i = 0; i < 7; i++) { const a = (i / 7) * Math.PI * 2; const sp = new T.Mesh(new T.ConeGeometry(0.085, 0.28, 16), goldMat); sp.position.set(Math.cos(a) * 0.44, 0.2, Math.sin(a) * 0.44); crown.add(sp); const b = new T.Mesh(new T.SphereGeometry(0.05, 12, 12), glow(0xffe680)); b.position.set(Math.cos(a) * 0.44, 0.35, Math.sin(a) * 0.44); crown.add(b); }
    const gem = new T.Mesh(new T.SphereGeometry(0.1, 16, 16), glow(0xff3a4a)); gem.position.set(0, 0.02, 0.46); crown.add(gem);

    // paws
    [-1, 1].forEach((s) => { const p = new T.Mesh(new T.SphereGeometry(0.28, 24, 18), fur(0xcdae82)); p.scale.set(1.25, 0.68, 1.15); p.position.set(s * 0.42, -0.84, 0.64); cat.add(p); });

    // tail
    const tailMat = fur(0x9c7044);
    let tailMesh = null;
    const buildTail = (t) => {
      const pts = [];
      for (let i = 0; i <= 10; i++) { const f = i / 10; const wag = Math.sin(t * 2.2 - f * 2.4) * (0.35 + f * 0.55); pts.push(new T.Vector3(-0.7 - f * 0.55 + wag * 0.35, -0.35 + f * 1.35 + Math.sin(t * 2.2 - f * 2.4) * f * 0.5, -0.32 - f * 0.25)); }
      const curve = new T.CatmullRomCurve3(pts);
      const geo = new T.TubeGeometry(curve, 26, 0.19, 12, false);
      if (tailMesh) { tailMesh.geometry.dispose(); tailMesh.geometry = geo; }
      else { tailMesh = new T.Mesh(geo, tailMat); cat.add(tailMesh); }
    };
    buildTail(0);
    const tailTip = new T.Mesh(new T.SphereGeometry(0.2, 16, 14), fur(0xd9b985)); cat.add(tailTip);

    // cake
    const cake = new T.Group(); cake.position.set(2.0, -0.55, 0.15); scene.add(cake);
    const cream = (y, r, h) => { const m = new T.Mesh(new T.CylinderGeometry(r, r, h, 32), fur(0xfff4e0, 0.5)); m.position.y = y; cake.add(m); return m; };
    cake.add(new T.Mesh(new T.CylinderGeometry(0.5, 0.52, 0.36, 32), fur(0x7a3810, 0.7)));
    cream(0.21, 0.53, 0.12);
    const top = new T.Mesh(new T.CylinderGeometry(0.34, 0.36, 0.32, 28), fur(0x9a4820, 0.7)); top.position.y = 0.44; cake.add(top);
    cream(0.62, 0.37, 0.1);
    const candle = new T.Mesh(new T.CylinderGeometry(0.045, 0.05, 0.36, 12), glow(0xff9ec0)); candle.position.y = 0.86; cake.add(candle);
    const flame = new T.Mesh(new T.SphereGeometry(0.09, 14, 14), glow(0xffe24a)); flame.scale.set(1, 1.8, 1); flame.position.y = 1.12; cake.add(flame);
    const flameLight = new T.PointLight(0xffb060, 1.2, 6, 2); flameLight.position.set(2.0, 0.7, 0.5); scene.add(flameLight);

    // lights
    scene.add(new T.AmbientLight(0x3a2a1a, 0.42));
    const key = new T.DirectionalLight(0xfff2e0, 0.9); key.position.set(3, 4.5, 5); scene.add(key);
    const rim = new T.DirectionalLight(0x6a90c0, 0.7); rim.position.set(-4, 2.5, -3); scene.add(rim);
    const bounce = new T.DirectionalLight(0xffcaa0, 0.2); bounce.position.set(0, -3, 3); scene.add(bounce);

    const catFrame = (t) => {
      cat.rotation.y = Math.sin(t * 0.5) * 0.42;
      cat.position.y = Math.sin(t * 1.3) * 0.045;
      body.scale.y = 0.95 + Math.sin(t * 2.2) * 0.02;
      head.rotation.z = Math.sin(t * 0.7) * 0.05; head.rotation.x = Math.sin(t * 0.9) * 0.03;
      const tw = (Math.sin(t * 0.6) > 0.9) ? Math.sin(t * 30) * 0.12 : 0;
      earL.rotation.z = 0.22 + tw; earR.rotation.z = -0.22 - tw;
      const bl = (Math.sin(t * 0.55) > 0.93) ? 0.14 : 1; eyes.forEach((e) => { e.scale.y = bl; });
      crown.rotation.y = t * 0.45;
      gem.material.color.setRGB(1, 0.22 + 0.12 * Math.sin(t * 4), 0.29 + 0.06 * Math.sin(t * 4));
      buildTail(t);
      const f = 1; const wag = Math.sin(t * 2.2 - f * 2.4) * (0.35 + f * 0.55);
      tailTip.position.set(-0.7 - 0.55 + wag * 0.35, -0.35 + 1.35 + Math.sin(t * 2.2 - 2.4) * 0.5, -0.32 - 0.25);
      const fk = 0.85 + Math.sin(t * 12) * 0.12 + Math.sin(t * 27) * 0.05;
      flame.scale.set(fk, 1.8 * fk, fk); flame.position.x = 2.0 - 2.0 + Math.sin(t * 9) * 0.015;
      flameLight.intensity = 0.95 + Math.sin(t * 13) * 0.3;
      composer.render();
    };
    const t0 = performance.now();
    const loop = (ms) => { _catRAF = requestAnimationFrame(loop); catFrame((ms - t0) / 1000); };
    window.__dvCatFrame = catFrame;
    catFrame(0.8);
    _catRAF = requestAnimationFrame(loop);

    const ro = new ResizeObserver(() => { W = mount.clientWidth || W; H = mount.clientHeight || H; camera.aspect = W / H; camera.updateProjectionMatrix(); renderer.setSize(W, H, false); composer.setSize(W, H); bloom.setSize(W, H); });
    ro.observe(mount);

}
</script>
</body></html>
