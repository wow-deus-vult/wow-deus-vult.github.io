<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Armory — Deus Vult</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Exo+2:wght@500;600;700;800;900&family=Manrope:wght@400;500;600;700&display=swap');
  :root {
    --bg:#070a0f; --bg2:#0d121b; --bg3:#141b26;
    --border:#1e2836; --border2:#283447;
    --accent:#8fc1e3; --accent-dim:#4a6f8a;
    --text:#dce4ee; --text-muted:#7c8aa0; --text-faint:#566275;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:'Manrope',sans-serif;font-size:14px;min-height:100vh;}

  /* ── NAV ── */
  nav{background:rgba(13,18,27,.85);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);
    padding:0 24px;display:flex;align-items:center;height:56px;position:sticky;top:0;z-index:100;}
  .nav-logo{font-family:'Exo 2',sans-serif;font-weight:800;font-size:16px;color:var(--accent);
    letter-spacing:.08em;margin-right:36px;text-decoration:none;display:flex;align-items:center;gap:8px;}
  .nav-logo span{width:8px;height:8px;background:var(--accent);border-radius:2px;transform:rotate(45deg);box-shadow:0 0 12px var(--accent);}
  .nav-links{display:flex;gap:2px;flex-wrap:wrap;}
  .nav-links a{color:var(--text-muted);text-decoration:none;padding:7px 14px;border-radius:7px;font-size:13px;font-weight:600;transition:.15s;}
  .nav-links a:hover{color:var(--text);background:var(--bg3);}
  .nav-links a.active{color:var(--accent);background:rgba(143,193,227,.1);}
  .nav-toggle{display:none;background:none;border:1px solid var(--border2);border-radius:8px;
    color:var(--text);width:38px;height:38px;cursor:pointer;margin-left:auto;align-items:center;
    justify-content:center;font-size:18px;line-height:1;}

  /* ── LAYOUT ── */
  .page{max-width:1200px;margin:0 auto;padding:32px 24px 64px;}
  .page-header{margin-bottom:28px;}
  .page-title{font-family:'Exo 2',sans-serif;font-size:clamp(22px,3vw,32px);font-weight:900;
    letter-spacing:.1em;color:var(--text);margin-bottom:6px;}
  .page-sub{color:var(--text-muted);font-size:13px;}

  /* ── SEARCH ROW ── */
  .search-row{display:flex;gap:10px;margin-bottom:20px;align-items:center;flex-wrap:wrap;}
  .search-input{flex:1;min-width:180px;background:var(--bg2);border:1px solid var(--border2);
    border-radius:8px;color:var(--text);font-family:'Manrope',sans-serif;font-size:14px;
    padding:9px 14px;outline:none;transition:.15s;}
  .search-input:focus{border-color:var(--accent-dim);}
  .search-input::placeholder{color:var(--text-faint);}
  .sort-select{background:var(--bg2);border:1px solid var(--border2);border-radius:8px;
    color:var(--text);font-size:13px;padding:9px 12px;outline:none;cursor:pointer;}
  .class-filter{background:var(--bg2);border:1px solid var(--border2);border-radius:8px;
    color:var(--text);font-size:13px;padding:9px 12px;outline:none;cursor:pointer;}
  .result-count{color:var(--text-muted);font-size:13px;white-space:nowrap;}

  /* ── CHARACTER TABLE ── */
  .tbl-wrap{overflow-x:auto;}
  .char-table{width:100%;border-collapse:collapse;}
  .char-table th{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--text-faint);
    padding:8px 12px;border-bottom:1px solid var(--border);text-align:left;font-weight:600;
    cursor:pointer;user-select:none;white-space:nowrap;}
  .char-table th:hover{color:var(--text-muted);}
  .char-table th.sorted{color:var(--accent);}
  .char-table th.r{text-align:right;}
  .char-table td{padding:9px 12px;border-bottom:1px solid var(--border);font-size:13px;}
  .char-table tr:last-child td{border-bottom:none;}
  .char-table tr.data-row:hover td{background:rgba(143,193,227,.04);cursor:pointer;}
  .c-rank{color:var(--text-faint);font-size:11px;font-family:'Exo 2',sans-serif;text-align:right;padding-right:4px;}
  .c-name{font-weight:700;font-family:'Exo 2',sans-serif;font-size:14px;}
  .c-class{font-weight:600;font-size:12px;}
  .c-race{color:var(--text-muted);font-size:12px;}
  .c-guild{color:var(--text-muted);font-size:12px;}
  .c-gs{font-family:'Exo 2',sans-serif;font-weight:800;font-size:15px;text-align:right;}
  .c-ilvl{font-family:'Exo 2',sans-serif;font-weight:700;color:var(--text-muted);text-align:right;}
  .c-date{color:var(--text-faint);font-size:11px;}

  /* ── PROFILE ── */
  .profile-view{display:none;}
  .profile-view.active{display:block;}
  .list-view.hidden{display:none;}

  .btn-back{background:none;border:1px solid var(--border2);border-radius:8px;color:var(--text-muted);
    font-size:13px;padding:8px 14px;cursor:pointer;margin-bottom:20px;font-family:'Manrope',sans-serif;
    transition:.15s;}
  .btn-back:hover{color:var(--text);border-color:var(--accent-dim);}

  /* Profile header */
  .profile-hdr{background:var(--bg2);border:1px solid var(--border);border-radius:12px;
    padding:20px 24px;margin-bottom:20px;display:flex;align-items:center;gap:20px;flex-wrap:wrap;}
  .profile-icon{width:60px;height:60px;border-radius:10px;overflow:hidden;flex-shrink:0;
    border:2px solid var(--border2);}
  .profile-icon img{width:100%;height:100%;object-fit:cover;display:block;}
  .profile-info{flex:1;min-width:180px;}
  .profile-name{font-family:'Exo 2',sans-serif;font-size:clamp(18px,3vw,26px);font-weight:900;
    letter-spacing:.05em;line-height:1.1;margin-bottom:5px;}
  .profile-meta{color:var(--text-muted);font-size:13px;margin-bottom:3px;}
  .profile-guild{font-weight:700;color:var(--accent);font-size:13px;}
  .profile-scan{color:var(--text-faint);font-size:11px;margin-top:5px;}
  .profile-stats-row{display:flex;gap:20px;text-align:center;flex-shrink:0;}
  .ps{display:flex;flex-direction:column;align-items:center;}
  .ps-val{font-family:'Exo 2',sans-serif;font-size:26px;font-weight:900;line-height:1;}
  .ps-lbl{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--text-muted);margin-top:3px;}

  /* Paper doll */
  .doll{display:grid;grid-template-columns:1fr 1fr;gap:6px;max-width:880px;}
  .doll-col{display:flex;flex-direction:column;gap:5px;}

  .item-slot{display:flex;align-items:center;gap:9px;background:var(--bg2);
    border:1px solid var(--border);border-left:3px solid transparent;border-radius:8px;
    padding:7px 10px;transition:.12s;text-decoration:none;color:inherit;}
  .item-slot:not(.empty):hover{background:var(--bg3);cursor:pointer;}
  .item-slot.empty{opacity:.45;}
  .iico{width:36px;height:36px;border-radius:5px;overflow:hidden;flex-shrink:0;
    background:var(--bg3);display:flex;align-items:center;justify-content:center;}
  .iico img{width:100%;height:100%;object-fit:cover;display:block;}
  .iico.no-img::after{content:'?';color:var(--text-faint);font-size:14px;}
  .iinfo{flex:1;min-width:0;}
  .slot-lbl{font-size:10px;color:var(--text-faint);letter-spacing:.05em;line-height:1;margin-bottom:2px;}
  .item-name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .item-ilvl{font-size:11px;color:var(--text-muted);}

  /* Quality colors */
  .q0{border-left-color:#9d9d9d;} .q0 .item-name{color:#9d9d9d;}
  .q1{border-left-color:#aaa;}    .q1 .item-name{color:#dce4ee;}
  .q2{border-left-color:#1eff00;} .q2 .item-name{color:#1eff00;}
  .q3{border-left-color:#0070dd;} .q3 .item-name{color:#0070dd;}
  .q4{border-left-color:#a335ee;} .q4 .item-name{color:#a335ee;}
  .q5{border-left-color:#ff8000;} .q5 .item-name{color:#ff8000;}
  .q6,.q7{border-left-color:#e6cc80;} .q6 .item-name,.q7 .item-name{color:#e6cc80;}

  footer{text-align:center;padding:36px 24px;color:var(--text-faint);font-size:12px;
    border-top:1px solid var(--border);margin-top:24px;}

  @media(max-width:768px){
    nav{padding:0 14px;}
    .nav-links{display:none;flex-direction:column;gap:2px;width:100%;}
    .nav-links.open{display:flex;}
    .nav-links a{padding:12px 14px;font-size:15px;}
    .nav-toggle{display:flex;}
    .nav-logo{margin-right:0;}
    .doll{grid-template-columns:1fr;}
    .profile-stats-row{gap:14px;}
  }
</style>
</head>
<body>

<nav>
  <a class="nav-logo" href="../"><span></span>DEUS VULT</a>
  <div class="nav-links" id="nav-links">
    <a href="../">Головна</a>
    <a href="../guild-ranking/">Рейтинг DPS</a>
    <a href="../heal-ranking/">Рейтинг Heal</a>
    <a href="../tank-ranking/">Рейтинг Tank</a>
    <a href="../potion-stats/">Статистика Зіль</a>
    <a href="../total-damage/">Total Damage</a>
    <a href="./" class="active">Armory</a>
    <a href="../analytics/">Аналітика</a>
    <a href="../dont-push/">Dont Push</a>
    <a href="../invaders/">Invaders Must Die</a>
  </div>
  <button class="nav-toggle" onclick="document.getElementById('nav-links').classList.toggle('open')">☰</button>
</nav>

<div class="page">

  <div class="page-header">
    <h1 class="page-title">ARMORY</h1>
    <p class="page-sub" id="page-sub">Завантаження…</p>
  </div>

  <!-- LIST VIEW -->
  <div class="list-view" id="list-view">
    <div class="search-row">
      <input class="search-input" id="search" type="text"
        placeholder="Пошук по імені або гільдії…" oninput="filterAndRender()">
      <select class="class-filter" id="class-filter" onchange="filterAndRender()">
        <option value="">Всі класи</option>
        <option value="DK">Death Knight</option>
        <option value="DR">Druid</option>
        <option value="HU">Hunter</option>
        <option value="MA">Mage</option>
        <option value="PA">Paladin</option>
        <option value="PR">Priest</option>
        <option value="RO">Rogue</option>
        <option value="SH">Shaman</option>
        <option value="WA">Warrior</option>
        <option value="WL">Warlock</option>
      </select>
      <select class="sort-select" id="sort-sel" onchange="filterAndRender()">
        <option value="gs">GearScore ↓</option>
        <option value="ilvl">iLevel ↓</option>
        <option value="name">Ім'я A–Z</option>
        <option value="date">Дата сканування ↓</option>
      </select>
      <span class="result-count" id="result-count"></span>
    </div>
    <div class="tbl-wrap">
      <table class="char-table">
        <thead>
          <tr>
            <th class="r" style="width:36px">#</th>
            <th>Ім'я</th>
            <th>Клас</th>
            <th>Раса</th>
            <th>Гільдія</th>
            <th class="r">GearScore</th>
            <th class="r">iLevel</th>
            <th>Скановано</th>
          </tr>
        </thead>
        <tbody id="char-tbody"></tbody>
      </table>
    </div>
  </div>

  <!-- PROFILE VIEW -->
  <div class="profile-view" id="profile-view">
    <button class="btn-back" onclick="showList()">← Назад до списку</button>
    <div class="profile-hdr" id="profile-hdr"></div>
    <div class="doll" id="profile-doll"></div>
  </div>

</div>

<footer>
  Дані: GearScore addon · Freedom x5 · Оновлено: <span id="updated-lbl">—</span>
</footer>

<script>
const CLASS_NAMES = {
  DK:'Death Knight',DR:'Druid',HU:'Hunter',MA:'Mage',PA:'Paladin',
  PR:'Priest',RO:'Rogue',SH:'Shaman',WA:'Warrior',WL:'Warlock'
};
const RACE_NAMES = {
  OR:'Orc',TR:'Troll',TA:'Tauren',UN:'Undead',BE:'Blood Elf',
  HU:'Human',DW:'Dwarf',NE:'Night Elf',GN:'Gnome',DR:'Draenei',
  GO:'Goblin',WO:'Worgen'
};
const CLASS_COLORS = {
  DK:'#c41e3a',DR:'#ff7c0a',HU:'#aad372',MA:'#3fc7eb',PA:'#f48cba',
  PR:'#d4d4d4',RO:'#fff468',SH:'#0070dd',WA:'#c69b3a',WL:'#8788ee'
};
const CLASS_ICON = {
  DK:'deathknight',DR:'druid',HU:'hunter',MA:'mage',PA:'paladin',
  PR:'priest',RO:'rogue',SH:'shaman',WA:'warrior',WL:'warlock'
};
const SLOT_NAMES = [
  null,'Head','Neck','Shoulders','Shirt','Chest',
  'Waist','Legs','Feet','Wrist','Hands',
  'Ring 1','Ring 2','Trinket 1','Trinket 2','Back',
  'Main Hand','Off Hand','Ranged'
];
// Paper doll columns: left and right
const LEFT_SLOTS  = [1,3,5,6,7,8,16,17,4];
const RIGHT_SLOTS = [2,15,9,10,11,12,13,14,18];

let allChars = [], items = {}, filtered = [];

function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function fmtDate(d){
  if(!d) return '—';
  const s = String(d);
  return s.length >= 8 ? s.slice(0,4)+'-'+s.slice(4,6)+'-'+s.slice(6,8) : s;
}

function filterAndRender(){
  const q = (document.getElementById('search').value||'').trim().toLowerCase();
  const cls = document.getElementById('class-filter').value;
  const sort = document.getElementById('sort-sel').value;

  filtered = allChars.filter(c => {
    if(cls && c.class !== cls) return false;
    if(q){
      const nameOk = c.name.toLowerCase().includes(q);
      const guildOk = c.guild && c.guild !== '*' && c.guild.toLowerCase().includes(q);
      if(!nameOk && !guildOk) return false;
    }
    return true;
  });

  if(sort === 'gs')   filtered.sort((a,b)=>(b.gs||0)-(a.gs||0));
  if(sort === 'ilvl') filtered.sort((a,b)=>(b.ilvl||0)-(a.ilvl||0));
  if(sort === 'name') filtered.sort((a,b)=>a.name.localeCompare(b.name));
  if(sort === 'date') filtered.sort((a,b)=>(b.date||0)-(a.date||0));

  renderTable();
}

function renderTable(){
  document.getElementById('result-count').textContent = filtered.length + ' гравців';
  const rows = filtered.map((c, i) => {
    const col = CLASS_COLORS[c.class] || '#dce4ee';
    const guild = (c.guild && c.guild !== '*') ? esc(c.guild) : '—';
    return `<tr class="data-row" onclick="showChar(${JSON.stringify(c.name)})">
      <td class="c-rank">${i+1}</td>
      <td><span class="c-name" style="color:${col}">${esc(c.name)}</span></td>
      <td class="c-class" style="color:${col}">${CLASS_NAMES[c.class]||c.class}</td>
      <td class="c-race">${RACE_NAMES[c.race]||c.race||'—'}</td>
      <td class="c-guild">${guild}</td>
      <td class="c-gs" style="color:${col}">${c.gs ? c.gs.toLocaleString() : '—'}</td>
      <td class="c-ilvl">${c.ilvl||'—'}</td>
      <td class="c-date">${fmtDate(c.date)}</td>
    </tr>`;
  });
  document.getElementById('char-tbody').innerHTML = rows.join('');
}

function showList(){
  document.getElementById('list-view').classList.remove('hidden');
  document.getElementById('profile-view').classList.remove('active');
}

function showChar(name){
  const char = allChars.find(c => c.name === name);
  if(!char) return;
  document.getElementById('list-view').classList.add('hidden');
  document.getElementById('profile-view').classList.add('active');
  renderProfile(char);
  window.scrollTo(0,0);
}

function renderProfile(char){
  const col = CLASS_COLORS[char.class] || '#dce4ee';
  const cls = CLASS_NAMES[char.class] || char.class;
  const race = RACE_NAMES[char.race] || char.race || '';
  const guild = (char.guild && char.guild !== '*') ? char.guild : null;
  const icon = CLASS_ICON[char.class] || 'warrior';

  document.getElementById('profile-hdr').innerHTML = `
    <div class="profile-icon">
      <img src="https://wow.zamimg.com/images/wow/icons/large/classicon_${icon}.jpg"
           alt="${cls}" onerror="this.style.opacity='.3'">
    </div>
    <div class="profile-info">
      <div class="profile-name" style="color:${col}">${esc(char.name)}</div>
      <div class="profile-meta">${cls} · ${race} · Рівень ${char.level||80}</div>
      ${guild ? `<div class="profile-guild">&lt;${esc(guild)}&gt;</div>` : ''}
      <div class="profile-scan">
        Відскановано: ${fmtDate(char.date)}${char.scanned ? ` · by ${esc(char.scanned)}` : ''}
      </div>
    </div>
    <div class="profile-stats-row">
      <div class="ps">
        <span class="ps-val" style="color:${col}">${char.gs ? char.gs.toLocaleString() : '—'}</span>
        <span class="ps-lbl">GearScore</span>
      </div>
      <div class="ps">
        <span class="ps-val">${char.ilvl||'—'}</span>
        <span class="ps-lbl">Avg iLevel</span>
      </div>
    </div>`;

  // Build equip map: slot → item entry
  const equip = {};
  (char.equip||[]).forEach(e => { if(e.itemId) equip[e.slot] = e; });

  function slotHtml(slotNum){
    const slotName = SLOT_NAMES[slotNum] || ('Slot '+slotNum);
    const e = equip[slotNum];
    if(!e || !e.itemId){
      return `<div class="item-slot empty">
        <div class="iico"></div>
        <div class="iinfo">
          <div class="slot-lbl">${slotName}</div>
          <div class="item-name" style="color:var(--text-faint);font-weight:400">Порожньо</div>
        </div>
      </div>`;
    }
    const item = items[String(e.itemId)];
    if(!item){
      return `<div class="item-slot q1">
        <div class="iico no-img"></div>
        <div class="iinfo">
          <div class="slot-lbl">${slotName}</div>
          <div class="item-name">Item #${e.itemId}</div>
        </div>
      </div>`;
    }
    const q = item.quality||1;
    const icon_url = `https://wow.zamimg.com/images/wow/icons/medium/${item.icon}.jpg`;
    const wh_url   = `https://www.wowhead.com/wotlk/item=${e.itemId}`;
    return `<a class="item-slot q${q}" href="${wh_url}" target="_blank" rel="noopener">
      <div class="iico">
        <img src="${icon_url}" alt="" loading="lazy"
             onerror="this.parentNode.classList.add('no-img');this.remove()">
      </div>
      <div class="iinfo">
        <div class="slot-lbl">${slotName}</div>
        <div class="item-name">${esc(item.name)}</div>
        ${item.ilvl ? `<div class="item-ilvl">ilvl ${item.ilvl}</div>` : ''}
      </div>
    </a>`;
  }

  const leftHtml  = LEFT_SLOTS.map(slotHtml).join('');
  const rightHtml = RIGHT_SLOTS.map(slotHtml).join('');
  document.getElementById('profile-doll').innerHTML =
    `<div class="doll-col">${leftHtml}</div><div class="doll-col">${rightHtml}</div>`;
}

async function init(){
  try{
    const r = await fetch('./armory_data.json');
    if(!r.ok) throw new Error('HTTP '+r.status);
    const data = await r.json();
    allChars = data.characters || [];
    items    = data.items      || {};
    const upd = data.updated || '—';
    document.getElementById('updated-lbl').textContent = upd;
    document.getElementById('page-sub').textContent =
      `${allChars.length} гравців · Freedom x5 · Дані від ${upd}`;
    filterAndRender();
  } catch(e){
    document.getElementById('page-sub').textContent = 'Помилка завантаження даних: ' + e.message;
  }
}

init();
</script>
</body>
</html>
