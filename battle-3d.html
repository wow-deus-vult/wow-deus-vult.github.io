<!DOCTYPE html>
<html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deus Vult – Battle</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@500;600;700;800;900&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>html,body{margin:0;padding:0;height:100%;background:#050d13;overflow:hidden;font-family:'Manrope',sans-serif;}#dv-stage{position:absolute;inset:0;}</style>
</head><body>
<div id="dv-stage">
    <div id="dv-battle-mount" style="position:absolute;inset:0;"></div>

    <div style="position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 82% 82% at 50% 46%, transparent 50%, rgba(0,0,0,.6) 100%);"></div>
    <div id="dv-flash" style="position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 52%, rgba(175,225,255,.95), rgba(45,130,175,.35) 55%, transparent 80%);opacity:0;mix-blend-mode:screen;"></div>
    <div id="dv-gold" style="position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 50%, rgba(255,212,115,.6), rgba(255,150,45,.16) 50%, transparent 76%);opacity:0;mix-blend-mode:screen;"></div>
    <div id="dv-black" style="position:absolute;inset:0;pointer-events:none;background:#050d13;opacity:1;"></div>

    <!-- cinematic letterbox -->
    <div style="position:absolute;top:0;left:0;right:0;height:8%;background:#000;pointer-events:none;z-index:4;"></div>
    <div style="position:absolute;bottom:0;left:0;right:0;height:8%;background:#000;pointer-events:none;z-index:4;"></div>

    <div style="position:absolute;left:0;right:0;top:20%;text-align:center;pointer-events:none;z-index:5;">
      <div id="capIce" style="opacity:0;">
        <div style="font-family:'Exo 2',sans-serif;font-size:clamp(22px,3.4vw,36px);font-weight:900;letter-spacing:.2em;color:#bfe6f4;text-shadow:0 0 34px rgba(90,190,225,.85);">ICECROWN CITADEL</div>
        <div style="font-family:'Exo 2',sans-serif;font-size:13px;letter-spacing:.34em;text-transform:uppercase;color:#6aa2b8;margin-top:10px;">The Frozen Throne</div>
      </div>
      <div id="capFrost" style="opacity:0;position:absolute;left:0;right:0;top:0;">
        <div style="font-family:'Exo 2',sans-serif;font-size:clamp(22px,3.4vw,34px);font-weight:900;letter-spacing:.16em;color:#cfe6ff;text-shadow:0 0 38px rgba(70,150,255,.9);">FROSTMOURNE&nbsp;&nbsp;HUNGERS</div>
      </div>
      <div id="capWin" style="opacity:0;position:absolute;left:0;right:0;top:0;">
        <div style="font-family:'Exo 2',sans-serif;font-size:clamp(26px,4.4vw,48px);font-weight:900;letter-spacing:.1em;color:#ffd96b;text-shadow:0 0 44px rgba(255,170,0,.95);">DEUS&nbsp;VULT&nbsp;VINCIT!</div>
        <div style="font-family:'Exo 2',sans-serif;font-size:clamp(12px,1.7vw,17px);letter-spacing:.16em;color:#cc9a44;margin-top:12px;">The Lich King has fallen.</div>
      </div>
    </div>

    <button id="dv-replay" style="position:absolute;right:16px;bottom:calc(8% + 14px);z-index:6;background:rgba(10,20,28,.72);border:1px solid #24485a;color:#8fd4e3;font-family:'Exo 2',sans-serif;font-size:12px;font-weight:700;letter-spacing:.08em;padding:8px 14px;border-radius:8px;cursor:pointer;backdrop-filter:blur(6px);">&#8635; Replay</button>
</div>
<script>

const base='https://unpkg.com/three@0.134.0/';
const urls=[base+'build/three.min.js',base+'examples/js/objects/Reflector.js',base+'examples/js/shaders/CopyShader.js',base+'examples/js/shaders/LuminosityHighPassShader.js',base+'examples/js/postprocessing/Pass.js',base+'examples/js/postprocessing/ShaderPass.js',base+'examples/js/postprocessing/MaskPass.js',base+'examples/js/postprocessing/EffectComposer.js',base+'examples/js/postprocessing/RenderPass.js',base+'examples/js/postprocessing/UnrealBloomPass.js'];
function loadOne(u){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=u;s.async=false;s.onload=()=>res();s.onerror=()=>rej(new Error('load '+u));document.head.appendChild(s);});}
urls.reduce((p,u)=>p.then(()=>loadOne(u)),Promise.resolve()).then(()=>{ try{ initBattle(); }catch(e){ console.error(e); } });
function initBattle(){ let _battleRAF;

    const T = window.THREE;
    const mount = document.getElementById('dv-battle-mount');
    if (!T || !mount) return;
    const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
    const lerp = (a, b, t) => a + (b - a) * t;
    const smooth = (t) => t * t * (3 - 2 * t);
    const fio = (t, s, fi, fo, e) => { if (t <= s || t >= e) return 0; if (t < fi) return smooth((t - s) / (fi - s)); if (t > fo) return smooth(1 - (t - fo) / (e - fo)); return 1; };
    const rand = (a, b) => a + Math.random() * (b - a);

    let W = mount.clientWidth || 900, H = mount.clientHeight || 600;
    const scene = new T.Scene();
    scene.fog = new T.FogExp2(0x0a1e28, 0.026);

    const camera = new T.PerspectiveCamera(50, W / H, 0.1, 500);
    const renderer = new T.WebGLRenderer({ antialias: true, powerPreference: 'high-performance', preserveDrawingBuffer: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(W, H, false);
    renderer.setClearColor(0x081820, 1);
    renderer.domElement.style.width = '100%'; renderer.domElement.style.height = '100%'; renderer.domElement.style.display = 'block';
    mount.appendChild(renderer.domElement);

    const composer = new T.EffectComposer(renderer);
    composer.addPass(new T.RenderPass(scene, camera));
    const bloom = new T.UnrealBloomPass(new T.Vector2(W, H), 0.92, 0.6, 0.58);
    composer.addPass(bloom); composer.setSize(W, H);

    const dotTex = (() => { const cv = document.createElement('canvas'); cv.width = cv.height = 64; const g = cv.getContext('2d'); const gr = g.createRadialGradient(32, 32, 0, 32, 32, 32); gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(0.5, 'rgba(255,255,255,0.45)'); gr.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = gr; g.fillRect(0, 0, 64, 64); return new T.CanvasTexture(cv); })();

    const iceMat = (o, em) => new T.MeshPhongMaterial({ color: 0x2c6f86, emissive: em || 0x114a5e, specular: 0xcdf2ff, shininess: 85, transparent: true, opacity: o, flatShading: true });
    const rockMat = (c) => new T.MeshPhongMaterial({ color: c, specular: 0x2b4a56, shininess: 18, flatShading: true });
    const silMat = () => new T.MeshPhongMaterial({ color: 0x061119, specular: 0x0e2730, shininess: 24, flatShading: true });
    const add = (c, o) => new T.MeshBasicMaterial({ color: c, transparent: true, opacity: o == null ? 1 : o, blending: T.AdditiveBlending, depthWrite: false });

    // -- reflective ice floor
    let floor;
    try {
      floor = new T.Reflector(new T.PlaneGeometry(360, 360), { clipBias: 0.003, textureWidth: 1024, textureHeight: 1024, color: 0x18323c });
      floor.rotation.x = -Math.PI / 2; floor.position.y = 0; scene.add(floor);
    } catch (e) {
      floor = new T.Mesh(new T.PlaneGeometry(360, 360), new T.MeshPhongMaterial({ color: 0x0c2530, specular: 0x2a6076, shininess: 120 }));
      floor.rotation.x = -Math.PI / 2; scene.add(floor);
    }
    const iceSheet = new T.Mesh(new T.PlaneGeometry(360, 360), new T.MeshBasicMaterial({ color: 0x0b2028, transparent: true, opacity: 0.52, depthWrite: false }));
    iceSheet.rotation.x = -Math.PI / 2; iceSheet.position.y = 0.02; scene.add(iceSheet);

    // -- ice crystal forest
    const crystals = [];
    const THRONE_Z = -26;
    for (let i = 0; i < 60; i++) {
      let x, z, tries = 0;
      do { const ang = Math.random() * Math.PI * 2, dist = rand(14, 62); x = Math.cos(ang) * dist; z = THRONE_Z * 0.5 + Math.sin(ang) * dist; tries++; }
      while (Math.abs(x) < 8 && z > -8 && tries < 8);
      const h = rand(5, 26), r = rand(0.7, 2.6);
      const m = new T.Mesh(new T.ConeGeometry(r, h, Math.random() < 0.5 ? 4 : 5), iceMat(rand(0.42, 0.62), Math.random() < 0.3 ? 0x1d6d84 : 0x114a5e));
      m.position.set(x, h / 2 - rand(0.5, 2.5), z);
      m.rotation.y = Math.random() * Math.PI; m.rotation.z = rand(-0.28, 0.28); m.rotation.x = rand(-0.14, 0.14);
      scene.add(m); crystals.push(m);
    }
    for (let i = 0; i < 6; i++) {
      const h = rand(6, 12), r = rand(0.6, 1.4);
      const m = new T.Mesh(new T.ConeGeometry(r, h, 4), iceMat(0.5, 0x1a5f76));
      m.position.set(rand(-16, 16), rand(20, 30), THRONE_Z + rand(-6, 8)); m.rotation.x = Math.PI; m.rotation.z = rand(-0.2, 0.2);
      scene.add(m);
    }

    // -- stairs + throne platform
    const back = new T.Group(); scene.add(back);
    for (let i = 0; i < 7; i++) { const s = new T.Mesh(new T.BoxGeometry(11 - i * 0.6, 0.9, 1.7), rockMat(0x123542)); s.position.set(0, 0.45 + i * 0.9, THRONE_Z + 7 - i * 1.5); back.add(s); }
    const plat = new T.Mesh(new T.CylinderGeometry(6.5, 7.2, 1.4, 8), rockMat(0x0e2a34)); plat.position.set(0, 6.7, THRONE_Z - 2); back.add(plat);
    const pring = new T.Mesh(new T.TorusGeometry(4.6, 0.14, 8, 48), add(0x3fb4d6, 0.9)); pring.rotation.x = Math.PI / 2; pring.position.set(0, 7.5, THRONE_Z - 2); back.add(pring);
    const seat = new T.Mesh(new T.BoxGeometry(6, 9, 0.8), rockMat(0x0a2029)); seat.position.set(0, 11, THRONE_Z - 4.5); back.add(seat);
    for (let i = -2; i <= 2; i++) { const sp = new T.Mesh(new T.ConeGeometry(0.4, 2.6, 5), iceMat(0.7, 0x2a90b0)); sp.position.set(i * 1.5, 16.2, THRONE_Z - 4.5); back.add(sp); }

    // -- chains with banners
    const makeChain = (x) => {
      const g = new T.Group(); const links = 14;
      for (let i = 0; i < links; i++) { const l = new T.Mesh(new T.TorusGeometry(0.22, 0.07, 6, 10), rockMat(0x3a4a52)); l.position.set(x + Math.sin(i) * 0.04, 22 - i * 1.15, THRONE_Z + 2); l.rotation.x = (i % 2) * Math.PI / 2; g.add(l); }
      const ban = new T.Mesh(new T.PlaneGeometry(2.4, 4.2), new T.MeshPhongMaterial({ color: 0x14232b, emissive: 0x0a2b36, side: T.DoubleSide, transparent: true, opacity: 0.92 })); ban.position.set(x, 4.5, THRONE_Z + 2.05); g.add(ban);
      scene.add(g);
    };
    makeChain(-5.5); makeChain(5.5);

    // -- central light beam
    const beam = new T.Group(); beam.position.set(0, 0, THRONE_Z - 1); scene.add(beam);
    for (let i = 0; i < 2; i++) { const p = new T.Mesh(new T.PlaneGeometry(4.5, 24), add(0x7fe0ff, 0.16)); p.position.y = 12; p.rotation.y = i * Math.PI / 2; beam.add(p); }
    const beamCore = new T.Mesh(new T.CylinderGeometry(0.5, 1.4, 22, 12, 1, true), add(0xaef0ff, 0.22)); beamCore.position.y = 11; beam.add(beamCore);

    // -- god-ray shafts
    const shafts = [];
    for (let i = 0; i < 4; i++) { const p = new T.Mesh(new T.PlaneGeometry(rand(6, 12), 40), add(0x2f8fb0, 0.05)); p.position.set(rand(-18, 18), 20, THRONE_Z + rand(-4, 20)); p.rotation.z = rand(-0.3, 0.3); scene.add(p); shafts.push(p); }

    // -- arena runic ring
    const arena = new T.Group(); arena.position.set(0, 0.06, -12); scene.add(arena);
    arena.add(new T.Mesh(new T.TorusGeometry(10, 0.35, 8, 64), rockMat(0x1a3a46)));
    arena.add(new T.Mesh(new T.TorusGeometry(6.2, 0.22, 8, 56), add(0x2f9fc0, 0.55)));
    for (let i = 0; i < 8; i++) { const a = (i / 8) * Math.PI * 2; const sp = new T.Mesh(new T.ConeGeometry(0.4, 1.8, 4), iceMat(0.8, 0x2a90b0)); sp.position.set(Math.cos(a) * 10, 0.9, Math.sin(a) * 10); sp.rotation.x = Math.PI; arena.add(sp); }
    for (let i = 0; i < 10; i++) { const a = Math.random() * Math.PI * 2, len = rand(6, 22); const c = new T.Mesh(new T.PlaneGeometry(0.12, len), add(0x39b7d8, 0.4)); c.rotation.x = -Math.PI / 2; c.position.set(Math.cos(a) * len / 2, 0.05, -12 + Math.sin(a) * len / 2); c.rotation.z = -a; scene.add(c); }

    // -- silhouette figure factory
    const makeFig = (scl) => {
      const g = new T.Group(); const m = silMat();
      const body = new T.Mesh(new T.CylinderGeometry(0.28 * scl, 0.42 * scl, 1.5 * scl, 6), m); body.position.y = 0.95 * scl; g.add(body);
      const head = new T.Mesh(new T.SphereGeometry(0.26 * scl, 10, 10), m); head.position.y = 1.85 * scl; g.add(head);
      [-1, 1].forEach((s) => { const sh = new T.Mesh(new T.SphereGeometry(0.2 * scl, 8, 8), m); sh.scale.set(1, 0.7, 1); sh.position.set(s * 0.4 * scl, 1.45 * scl, 0); g.add(sh); });
      const cloak = new T.Mesh(new T.PlaneGeometry(0.9 * scl, 1.7 * scl), m); cloak.position.set(0, 1.0 * scl, -0.24 * scl); g.add(cloak);
      const wep = new T.Mesh(new T.BoxGeometry(0.06 * scl, 1.6 * scl, 0.1 * scl), m); wep.position.set(0.42 * scl, 1.15 * scl, 0.1 * scl); wep.rotation.z = 0.15; g.add(wep);
      return g;
    };
    const figs = [];
    const NF = 11;
    for (let i = 0; i < NF; i++) {
      const f = makeFig(rand(0.9, 1.12));
      const bx = rand(-16, 16), phase = Math.random() * Math.PI * 2, sp = rand(0.8, 1.3);
      f.position.set(bx, 0, 12);
      scene.add(f); figs.push({ g: f, bx, phase, sp, z0: rand(10, 16), z1: rand(-8, -2) });
    }
    const lk = makeFig(2.3); lk.position.set(0, 7.4, THRONE_Z - 2); lk.rotation.y = Math.PI; scene.add(lk);
    const lkEyes = new T.Mesh(new T.SphereGeometry(0.16, 8, 8), add(0xbdefff)); lkEyes.position.set(0, 7.4 + 1.85 * 2.3, THRONE_Z - 1.4); scene.add(lkEyes);
    const fmBlade = new T.Mesh(new T.BoxGeometry(0.22, 7, 0.08), add(0x8fd8ff, 0.95)); fmBlade.position.set(1.0 * 2.3, 7.4 + 1.2 * 2.3, THRONE_Z - 1.2); scene.add(fmBlade);

    // -- lights
    scene.add(new T.AmbientLight(0x0c2431, 0.55));
    const rimBack = new T.DirectionalLight(0x74d6ee, 1.05); rimBack.position.set(0, 16, THRONE_Z - 20); scene.add(rimBack);
    const throneLight = new T.PointLight(0x8fe6ff, 2.4, 90, 2); throneLight.position.set(0, 9, THRONE_Z + 1); scene.add(throneLight);
    const c1 = new T.PointLight(0x2f9fc0, 1.4, 46, 2); c1.position.set(-24, 8, -6); scene.add(c1);
    const c2 = new T.PointLight(0x2f9fc0, 1.4, 46, 2); c2.position.set(26, 10, -18); scene.add(c2);
    const fill = new T.DirectionalLight(0x1a3a4a, 0.5); fill.position.set(6, 12, 24); scene.add(fill);
    const gold = new T.PointLight(0xffb765, 0, 90, 2); gold.position.set(0, 8, THRONE_Z + 3); scene.add(gold);

    // -- snow
    const SN = 620;
    const snowPos = new Float32Array(SN * 3), snowV = new Float32Array(SN * 3);
    for (let i = 0; i < SN; i++) { snowPos[i*3] = rand(-70, 70); snowPos[i*3+1] = rand(0, 46); snowPos[i*3+2] = rand(-70, 30); snowV[i*3] = rand(-0.7, 0.7); snowV[i*3+1] = -rand(1.0, 2.4); snowV[i*3+2] = rand(-0.3, 0.3); }
    const snowGeo = new T.BufferGeometry(); snowGeo.setAttribute('position', new T.BufferAttribute(snowPos, 3));
    scene.add(new T.Points(snowGeo, new T.PointsMaterial({ color: 0xdff0ff, size: 0.3, map: dotTex, transparent: true, opacity: 0.6, depthWrite: false })));

    // -- particle system
    const MAX = 520;
    const pPos = new Float32Array(MAX * 3), pCol = new Float32Array(MAX * 3), pSize = new Float32Array(MAX), pAlpha = new Float32Array(MAX);
    const pVx = new Float32Array(MAX), pVy = new Float32Array(MAX), pVz = new Float32Array(MAX), pGy = new Float32Array(MAX), pLife = new Float32Array(MAX), pMaxL = new Float32Array(MAX);
    let pHead = 0;
    const pGeo = new T.BufferGeometry();
    pGeo.setAttribute('position', new T.BufferAttribute(pPos, 3));
    pGeo.setAttribute('pcolor', new T.BufferAttribute(pCol, 3));
    pGeo.setAttribute('psize', new T.BufferAttribute(pSize, 1));
    pGeo.setAttribute('palpha', new T.BufferAttribute(pAlpha, 1));
    const pMat = new T.ShaderMaterial({ transparent: true, depthWrite: false, blending: T.AdditiveBlending,
      vertexShader: 'attribute vec3 pcolor;attribute float psize;attribute float palpha;varying vec3 vC;varying float vA;void main(){vC=pcolor;vA=palpha;vec4 mv=modelViewMatrix*vec4(position,1.0);gl_PointSize=psize*(340.0/max(-mv.z,0.1));gl_Position=projectionMatrix*mv;}',
      fragmentShader: 'varying vec3 vC;varying float vA;void main(){vec2 c=gl_PointCoord-0.5;float d=length(c);float a=smoothstep(0.5,0.0,d)*vA;gl_FragColor=vec4(vC,a);}' });
    scene.add(new T.Points(pGeo, pMat));
    const spawn = (x, y, z, vx, vy, vz, gy, size, life, r, g, b) => {
      const i = pHead; pHead = (pHead + 1) % MAX;
      pPos[i*3] = x; pPos[i*3+1] = y; pPos[i*3+2] = z; pCol[i*3] = r; pCol[i*3+1] = g; pCol[i*3+2] = b;
      pVx[i] = vx; pVy[i] = vy; pVz[i] = vz; pGy[i] = gy; pSize[i] = size; pAlpha[i] = 1; pLife[i] = life; pMaxL[i] = life;
    };
    const updP = (dt) => {
      for (let i = 0; i < MAX; i++) { if (pLife[i] <= 0) { pAlpha[i] = 0; continue; } pVy[i] += pGy[i] * dt; pPos[i*3] += pVx[i] * dt; pPos[i*3+1] += pVy[i] * dt; pPos[i*3+2] += pVz[i] * dt; pLife[i] -= dt; pAlpha[i] = Math.max(pLife[i] / pMaxL[i], 0); }
      pGeo.attributes.position.needsUpdate = true; pGeo.attributes.pcolor.needsUpdate = true; pGeo.attributes.psize.needsUpdate = true; pGeo.attributes.palpha.needsUpdate = true;
    };

    // -- shockwave ring
    const shock = new T.Mesh(new T.RingGeometry(0.9, 1.3, 48), add(0x8fd8ff, 0)); shock.rotation.x = -Math.PI / 2; shock.position.set(0, 6.2, THRONE_Z - 2); scene.add(shock);
    let shockCyc = -1;

    // -- camera keyframes
    const KF = [
      { t: 0,    p: [0, 2.4, 24],   l: [0, 6, THRONE_Z] },
      { t: 7,    p: [0, 1.5, 9],    l: [0, 7, THRONE_Z] },
      { t: 10,   p: [0.5, 2.0, 4],  l: [0, 7.5, THRONE_Z] },
      { t: 13,   p: [-15, 2.6, 3],  l: [2, 3, -12] },
      { t: 16.5, p: [0, 19, -4],            l: [0, 0, -13] },
      { t: 19,   p: [-7, 8, THRONE_Z + 12], l: [0, 8, THRONE_Z - 2] },
      { t: 22,   p: [6, 7.5, THRONE_Z + 11], l: [0, 8, THRONE_Z - 2] },
      { t: 24.5, p: [-4, 8.5, THRONE_Z + 10], l: [0, 8.4, THRONE_Z - 2] },
      { t: 27,   p: [0, 8, THRONE_Z + 13],  l: [0, 7.6, THRONE_Z - 2] },
      { t: 29.5, p: [0, 9, THRONE_Z + 17],  l: [0, 6.4, THRONE_Z - 2] },
      { t: 32,   p: [0, 3, 12],     l: [0, 6.5, THRONE_Z] },
      { t: 34,   p: [0, 2.4, 24],   l: [0, 6, THRONE_Z] },
    ];
    const camAt = (t) => { let i = 0; while (i < KF.length - 2 && KF[i + 1].t <= t) i++; const a = KF[i], b = KF[i + 1], u = smooth(clamp((t - a.t) / (b.t - a.t), 0, 1)); return { px: lerp(a.p[0], b.p[0], u), py: lerp(a.p[1], b.p[1], u), pz: lerp(a.p[2], b.p[2], u), lx: lerp(a.l[0], b.l[0], u), ly: lerp(a.l[1], b.l[1], u), lz: lerp(a.l[2], b.l[2], u) }; };

    const capIce = document.getElementById('capIce'), capFrost = document.getElementById('capFrost'), capWin = document.getElementById('capWin');
    const flashEl = document.getElementById('dv-flash'), goldEl = document.getElementById('dv-gold'), blackEl = document.getElementById('dv-black');
    const replay = document.getElementById('dv-replay');
    const setCap = (el, v) => { if (!el) return; el.style.opacity = v.toFixed(3); el.style.transform = 'translateY(' + ((1 - v) * 8).toFixed(1) + 'px)'; };

    const DUR = 34;
    let start = performance.now(), prevMs = performance.now(), nextSpark = 0, nextClash = 0;
    if (replay) replay.addEventListener('click', () => { start = performance.now(); });

    const frame = (dt, t, cyc, ms) => {
      for (let i = 0; i < SN; i++) { snowPos[i*3] += snowV[i*3] * dt; snowPos[i*3+1] += snowV[i*3+1] * dt; snowPos[i*3+2] += snowV[i*3+2] * dt; if (snowPos[i*3+1] < -1) { snowPos[i*3+1] = 45; snowPos[i*3] = rand(-70, 70); } }
      snowGeo.attributes.position.needsUpdate = true;

      shafts.forEach((s, i) => { s.material.opacity = 0.035 + 0.03 * (0.5 + 0.5 * Math.sin(t * 0.7 + i)); });
      const beamPulse = 0.16 + 0.06 * Math.sin(t * 1.4);
      const clashB = (t >= 19.5 && t < 26.2) ? 1 : 0;
      beam.children.forEach((c) => { c.material.opacity = (c.geometry.type === 'CylinderGeometry' ? 0.13 : 0.09) * (beamPulse / 0.16) * (1 - clashB * 0.4); });
      pring.rotation.z = t * 0.2; arena.children[1].rotation.z = -t * 0.15;

      figs.forEach((o, idx) => {
        const van = idx < 4;
        let x, z, y = Math.abs(Math.sin(t * o.sp * 2 + o.phase)) * 0.18;
        if (t < 3) { z = o.z0 + 4; x = o.bx; }
        else if (t < 16) { z = lerp(o.z0, o.z1, smooth((t - 3) / 13)); x = o.bx + Math.sin(t * o.sp + o.phase) * 0.3; }
        else if (van && t >= 16.5) {
          const chg = smooth(clamp((t - 16.5) / 2.8, 0, 1));
          x = lerp(o.bx, (idx - 1.5) * 2.4, chg);
          z = lerp(o.z1, THRONE_Z + 6, chg);
          y = chg * 3.6;
          if (t >= 19.3 && t < 26.2) { const lg = Math.sin(t * 5 + o.phase); z -= Math.abs(lg) * 1.0; y += Math.abs(lg) * 0.4; }
        } else { z = o.z1 + Math.sin(t * 0.8 + o.phase) * 0.6; x = o.bx + Math.sin(t * o.sp + o.phase) * 0.3; }
        o.g.position.set(x, y, z);
        o.g.rotation.y = Math.PI + Math.sin(t * 0.5 + o.phase) * 0.15;
      });

      const combat = t >= 12.5 && t < 19.5;
      if (combat && ms >= nextSpark) { nextSpark = ms + 130; for (let n = 0; n < 4; n++) { const a = Math.random() * Math.PI * 2, rr = rand(2, 10); const warm = Math.random() < 0.35; spawn(Math.cos(a) * rr, rand(0.5, 2.5), -12 + Math.sin(a) * rr, rand(-2, 2), rand(0.5, 3), rand(-2, 2), -4, rand(0.5, 1.1), rand(0.4, 0.9), warm ? 1 : 0.45, warm ? 0.62 : 0.78, warm ? 0.24 : 1); } }
      if (t >= 19.3 && t < 26.2 && ms >= nextClash) { nextClash = ms + 140; const big = Math.random() < 0.3; for (let n = 0; n < (big ? 11 : 5); n++) { const a = Math.random() * Math.PI * 2, sp = rand(2, big ? 9 : 5); const warm = Math.random() < 0.4; spawn(rand(-2.5, 2.5), rand(6, 8.6), THRONE_Z - 1.4, Math.cos(a) * sp, rand(0, 4), Math.sin(a) * sp * 0.6, -4, rand(0.55, 1.3), rand(0.45, 0.95), warm ? 1 : 0.6, warm ? 0.66 : 0.82, warm ? 0.3 : 1); } }

      if (t >= 18.4 && t < 18.55 && shockCyc !== cyc) { shockCyc = cyc; shock.scale.set(1, 1, 1); shock.material.opacity = 0.95; for (let n = 0; n < 60; n++) { const a = Math.random() * Math.PI * 2, sp = rand(3, 11); spawn(0, 6.5, THRONE_Z - 2, Math.cos(a) * sp, rand(0, 4), Math.sin(a) * sp * 0.5, -3, rand(0.6, 1.3), rand(0.7, 1.1), 0.55, 0.8, 1); } }
      if (shock.material.opacity > 0.002) { const gg = 16 * dt; shock.scale.x += gg; shock.scale.z += gg; shock.material.opacity *= 0.92; }

      if (t >= 25.5 && t < 30 && ms >= nextSpark) { nextSpark = ms + 90; for (let n = 0; n < 4; n++) { const a = Math.random() * Math.PI * 2, sp = rand(2, 8); spawn(rand(-2, 2), rand(6, 10), THRONE_Z, Math.cos(a) * sp, rand(1, 5), Math.sin(a) * sp, -2.5, rand(0.6, 1.3), rand(0.6, 1.0), 1, 0.82, 0.4); } }
      updP(dt);

      const rise = smooth(clamp((t - 5) / 4, 0, 1));
      const fp = smooth(clamp((t - 26.5) / 3.2, 0, 1));
      const clash = (t >= 19.5 && t < 26.2) ? 1 : 0;
      let gi = 1 + (t >= 18.3 && t < 19.3 ? smooth(clamp((t - 18.3) / 0.2, 0, 1)) * (1 - smooth(clamp((t - 18.7) / 0.6, 0, 1))) : 0);
      if (clash) gi *= 0.78 + 0.4 * Math.abs(Math.sin(t * 7));
      gi *= (1 - fp * 0.92) * (0.4 + rise * 0.6);
      [lkEyes, fmBlade].forEach((m) => { if (!m.userData.b) m.userData.b = m.material.color.clone(); m.material.color.copy(m.userData.b).multiplyScalar(clamp(gi, 0.06, 2)); });
      lk.position.y = 7.4 - fp * 3; lk.rotation.z = fp * 0.5 + (clash ? Math.sin(t * 9) * 0.05 : 0);
      throneLight.intensity = 2.4 * (1 - fp * 0.6) * (0.5 + rise * 0.5);
      gold.intensity = fp * 5;

      const c = camAt(t);
      let sx = 0, sy = 0; const shk = Math.max((t >= 18.4 && t < 19.6) ? (1 - (t - 18.4) / 1.2) : 0, (t >= 26.5 && t < 29.5) ? (1 - (t - 26.5) / 3) * 0.5 : 0);
      if (shk > 0) { sx = (Math.random() - 0.5) * shk * 1.0; sy = (Math.random() - 0.5) * shk * 1.0; }
      camera.position.set(c.px + sx, c.py + sy, c.pz); camera.lookAt(c.lx, c.ly, c.lz);

      setCap(capIce, fio(t, 0.6, 2, 5, 6.5));
      setCap(capFrost, fio(t, 18, 18.6, 20, 21.5));
      setCap(capWin, fio(t, 26.5, 28, 32.6, 34));
      if (flashEl) flashEl.style.opacity = (fio(t, 18.35, 18.5, 18.75, 19.6) * 0.9).toFixed(3);
      if (goldEl) goldEl.style.opacity = (fp * 0.65 * (t > 32.6 ? Math.max(0, 1 - (t - 32.6) / 1.4) : 1)).toFixed(3);
      if (blackEl) { let bo = 0; if (t < 1) bo = 1 - t / 1; if (t > 32.8) bo = (t - 32.8) / 1.2; blackEl.style.opacity = clamp(bo, 0, 1).toFixed(3); }

      try { composer.render(); } catch (e) { console.error('[battle]', e); }
    };
    const loop = (ms) => { _battleRAF = requestAnimationFrame(loop); const dt = Math.min((ms - prevMs) / 1000, 0.05); prevMs = ms; const el = (ms - start) / 1000; frame(dt, el % DUR, Math.floor(el / DUR), ms); };
    window.__dvFrame = (t) => frame(0.016, t, 0, performance.now());
    window.__dvSeek = (sec) => { start = performance.now() - sec * 1000; };
    frame(0.016, 3.2, 0, performance.now());
    _battleRAF = requestAnimationFrame(loop);

    const ro = new ResizeObserver(() => { W = mount.clientWidth || W; H = mount.clientHeight || H; camera.aspect = W / H; camera.updateProjectionMatrix(); renderer.setSize(W, H, false); composer.setSize(W, H); bloom.setSize(W, H); if (floor.getRenderTarget) floor.getRenderTarget().setSize(1024, 1024); });
    ro.observe(mount);

}
</script>
